name: Atualizar Grade de Commits (3 Meses)

on:
  schedule:
    - cron: "0 3 * * *" # Roda diariamente às 00:00 (Brasília)
  push:
    paths:
      - "generate_grid.py"
      - ".github/workflows/update-commits.yml"
  workflow_dispatch:    # Botão manual na aba Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate_grid.py

      - name: Salvar arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add commits-3m.svg repo-*.svg README.md
          git diff --staged --quiet || git commit -m "chore: update top repos and 3m pixel grid"
          git push
